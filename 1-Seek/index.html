<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seek — population de véhicules</title>
    <link rel="stylesheet" href="style.css">
    <script src="libraries/p5.min.js"></script>
    <script src="vehicle.js"></script>
    <script src="target.js"></script>
    <script src="fleeVehicle.js"></script>
    <script src="population.js"></script>
    <script src="backgroundEffects.js"></script>
    <script src="soundEffects.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <header id="controls">
      <label for="vehicle-count">Véhicules :</label>  
      <input id="vehicle-count" type="range" min="1" max="200" step="1" value="20">
      <output id="vehicle-count-value" for="vehicle-count">20 / 200</output>

      <label for="max-speed">Vitesse max :</label>
      <input id="max-speed" type="range" min="1" max="20" step="1" value="4">
      <output id="max-speed-value" for="max-speed">4 / 20</output>

      <label for="max-force">Force max :</label>
      <input id="max-force" type="range" min="0.01" max="1" step="0.01" value="0.1">
      <output id="max-force-value" for="max-force">0.10 / 1.00</output>

      <label for="behavior-mode">Comportement :</label>
      <select id="behavior-mode">
        <option value="seek" selected>Poursuite (Seek)</option>
        <option value="flee">Fuite (Flee)</option>
      </select>

      <label for="arrival-variant">Arrivée :</label>
      <select id="arrival-variant">
        <option value="vehicle" selected>Variante A (Véhicule réapparaît)</option>
        <option value="target">Variante B (Cible réapparaît)</option>
      </select>

      <label for="bg-preset">Fond :</label>
      <select id="bg-preset">
        <option value="gradient-midnight" selected>Nuit boréale</option>
        <option value="gradient-cyberpunk">Cyberpunk</option>
        <option value="gradient-sunset">Crépuscule</option>
        <option value="gradient-ocean">Abysses</option>
        <option value="gradient-matrix">Matrice</option>
        <option value="black">Noir</option>
      </select>

      <label class="checkbox-label" for="toggle-trails">
        <input id="toggle-trails" type="checkbox"> Traînées
      </label>

      <button id="sound-btn" type="button" class="ctrl-btn" title="Activer / Désactiver le son (Web Audio API)">🔊 Son</button>
      <input id="sound-volume" type="range" min="0" max="1" step="0.05" value="0.2" title="Volume sonore" class="volume-slider">
    </header>
    <main id="scene" aria-label="Simulation de véhicules poursuivant une cible"></main>
  </body>
</html>
